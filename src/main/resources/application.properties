spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/polyforge}
spring.datasource.username=${DB_USER:polyforge}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_SCHEMA:update}
spring.jpa.open-in-view=false
server.error.include-message=never
polyforge.origin=${ANGULAR_ORIGIN:http://localhost:4200}
polyforge.demo-code=${DEMO_CODE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
